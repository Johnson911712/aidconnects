workflows:
  ios-capacitor-workflow:
    name: AidConnects iOS Build
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      node: latest
      xcode: latest
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Build Next.js static export
        script: npm run build
      - name: Sync web assets to native iOS project
        script: npx cap sync ios
      - name: Build unsigned IPA
        script: |
          cd ios/App
          
          # Resolve Swift Package Manager dependencies
          xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App
          
          # Build the app
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
          
          # Package into an IPA file
          cd build/DerivedData/Build/Products/Release-iphoneos
          mkdir Payload
          cp -r App.app Payload/
          zip -r App.ipa Payload
          
          # Move the IPA to a simple folder at the root of the project
          cd $CM_BUILD_DIR
          mkdir build_output
          cp ios/App/build/DerivedData/Build/Products/Release-iphoneos/App.ipa build_output/App.ipa
    artifacts:
      - build_output/App.ipa
      - /tmp/xcodebuild_logs/*.log